name: Kintep (Jiangsu Kintep Environmental Protection Co., Ltd.)
description: >-
  Jiangsu Kintep Environmental Protection Co., Ltd. (江苏康泰环保股份有限公司), founded in
  2011 and headquartered in Taizhou, Jiangsu, China, is a national high-tech
  enterprise that designs, manufactures, sells, and services new-type
  environmental-protection equipment and complete turnkey solutions. Kintep
  focuses on solid-liquid separation and intelligent sludge / pollutant
  collection and treatment. Its KINTEP product line includes multi-disc
  (stacked-screw) sludge dewatering machines, integrated automatic chemical
  dosing units, dense-phase belt sludge deep-dewatering machines,
  high-efficiency fully-automatic filter-press systems, Lamella sedimentation
  tanks, and screw presses. The company operates seven national customer-service
  centers (Shenzhen, Wuhan, Chongqing, Xi'an, Tianjin, Shanghai, Yixing) and
  exports to customers worldwide. Kintep is a physical industrial-equipment
  manufacturer and does not publish a public web API, developer portal, or
  developer documentation.
